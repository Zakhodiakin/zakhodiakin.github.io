<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Milk Burger · Queue</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Sofia+Sans+Extra+Condensed:wght@700;800&display=swap">
<style>
html,body{height:100%;margin:0}
#app{height:100%}
/* layout: one column, thumb-reach actions at the bottom, the queue ticket as the centrepiece */
.mbq{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#17233B; --ink-2:#465163; --ink-3:#6B7586;
  --rule:#D3DADF; --rule-soft:#E5EAED; --gold:#E2CB86; --gold-ink:#5C4A12;
  --ok:#2A7244; --ok-bg:#E0EFE4; --warn:#8A5200; --warn-bg:#FBEBCF; --bad:#B3261E; --bad-bg:#FBE4E1;
  --primary:#17233B; --on-primary:#FFFFFF; --ready:#1F6B3D; --on-ready:#FFFFFF; --focus:#2F6BFF;
  --shade:rgba(23,35,59,.38);
  --f-text:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Sofia Sans Extra Condensed","Arial Narrow","Roboto Condensed",var(--f-text);
  position:relative; height:100%; min-height:0; overflow:hidden; background:var(--bg); color:var(--ink);
  font:400 16px/1.45 var(--f-text); font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%; text-align:left;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .mbq{
    --bg:#0E1520; --surface:#162131; --ink:#E6EBF1; --ink-2:#B0BAC8; --ink-3:#8792A3;
    --rule:#2B384B; --rule-soft:#1D2838; --gold:#C9A957; --gold-ink:#F3E3B0;
    --ok:#6FCB91; --ok-bg:#15301F; --warn:#F2B866; --warn-bg:#3A2A0E; --bad:#FF8C80; --bad-bg:#3B1B18;
    --primary:#E6EBF1; --on-primary:#0E1520; --ready:#1B5A34; --on-ready:#FFFFFF; --focus:#86AEFF;
    --shade:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] .mbq{
  --bg:#0E1520; --surface:#162131; --ink:#E6EBF1; --ink-2:#B0BAC8; --ink-3:#8792A3;
  --rule:#2B384B; --rule-soft:#1D2838; --gold:#C9A957; --gold-ink:#F3E3B0;
  --ok:#6FCB91; --ok-bg:#15301F; --warn:#F2B866; --warn-bg:#3A2A0E; --bad:#FF8C80; --bad-bg:#3B1B18;
  --primary:#E6EBF1; --on-primary:#0E1520; --ready:#1B5A34; --on-ready:#FFFFFF; --focus:#86AEFF;
  --shade:rgba(0,0,0,.55);
}
.mbq *,.mbq *::before,.mbq *::after{box-sizing:border-box}
.mbq button,.mbq input{font:inherit;color:inherit;margin:0}
.mbq button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.mbq :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mbq [hidden]{display:none!important}
.mbq h1,.mbq h2,.mbq p{margin:0}
.mbq .brand{font:800 26px/1 var(--f-num);letter-spacing:.06em;text-transform:uppercase}
.mbq .muted{color:var(--ink-3)}
.mbq .num{font-family:var(--f-num);font-weight:800;letter-spacing:.01em}

/* buttons */
.mbq .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;
  border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:600;line-height:1.15;text-align:center}
.mbq .btn small{display:block;font-weight:500;font-size:12px;opacity:.8}
.mbq .btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.mbq .btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.mbq .btn.big{min-height:56px;font-size:18px;width:100%}
.mbq .btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.mbq .btn.danger{color:var(--bad);border-color:var(--bad)}
.mbq .btn[disabled]{opacity:.55;cursor:default}
.mbq .btn:active:not([disabled]){transform:translateY(1px)}

/* form */
.mbq .field{display:grid;gap:6px}
.mbq .field label,.mbq .label{font-weight:600;font-size:15px}
.mbq .field .hint{font-size:13px;color:var(--ink-3)}
.mbq .field input{min-height:52px;padding:10px 14px;border:1.5px solid var(--rule);border-radius:12px;background:var(--surface);font-size:17px;width:100%}
.mbq .field input:focus{border-color:var(--ink);outline:none}
.mbq .field.bad input{border-color:var(--bad)}
.mbq .err{color:var(--bad);font-size:14px;font-weight:500}
.mbq .sizes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.mbq .sizes.wide{grid-template-columns:repeat(6,1fr)}
.mbq .sizes button{min-height:52px;border:1.5px solid var(--rule);border-radius:12px;background:var(--surface);font:800 26px/1 var(--f-num)}
.mbq .sizes button[aria-checked="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

/* ---------- guest ---------- */
.mbq-guest .g-wrap{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.mbq-guest .g-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 6px}
.mbq-guest .g-live{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
.mbq-guest .g-live i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mbq-guest .g-live.off i{background:var(--warn)}
.mbq-guest .g-main{flex:1;display:flex;flex-direction:column;gap:18px;padding:10px 20px 24px;max-width:460px;width:100%;margin:0 auto}
.mbq-guest h1{font:800 44px/1 var(--f-num);letter-spacing:.01em;text-wrap:balance}
.mbq-guest .lead{font-size:16px;color:var(--ink-2)}
.mbq-guest .lead b{color:var(--ink);white-space:nowrap}
.mbq-guest form{display:grid;gap:18px}
.mbq-guest .fine{font-size:13px;color:var(--ink-3);text-align:center}
.mbq-guest .fine a{color:inherit}

.mbq .ticket{background:var(--surface);border:1px solid var(--rule);border-radius:18px;overflow:hidden}
.mbq .ticket .t-top{padding:18px 20px 20px;text-align:center}
.mbq .ticket .t-no{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.mbq .ticket .t-big{font:800 104px/.9 var(--f-num);margin-top:10px}
.mbq .ticket .t-big.text{font-size:64px;line-height:1}
.mbq .ticket .t-sub{font-size:15px;color:var(--ink-2);margin-top:2px}
.mbq .ticket .t-eta{display:inline-block;margin-top:14px;padding:8px 14px;border-radius:999px;background:var(--gold);color:#3B2F07;font-weight:600}
.mbq .ticket .tear{position:relative;border-top:2px dashed var(--rule)}
.mbq .ticket .tear::before,.mbq .ticket .tear::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--rule)}
.mbq .ticket .tear::before{left:-11px}
.mbq .ticket .tear::after{right:-11px}
.mbq .ticket .t-bot{display:flex;justify-content:space-between;gap:12px;padding:14px 20px;font-size:14px;color:var(--ink-2)}
.mbq .ticket .t-bot b{color:var(--ink)}
.mbq-guest .tip{text-align:center;color:var(--ink-2);font-size:15px}
.mbq-guest .confirm{display:grid;gap:10px;padding:14px;border:1px solid var(--rule);border-radius:14px;background:var(--surface);text-align:center}
.mbq-guest .confirm .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbq-guest .center{text-align:center;display:grid;gap:10px;justify-items:center;padding-top:8vh}
.mbq-guest.is-ready{background:var(--ready);color:var(--on-ready)}
.mbq-guest.is-ready .g-live,.mbq-guest.is-ready .lead{color:inherit;opacity:.9}
.mbq-guest.is-ready .g-live i{background:currentColor}
.mbq-guest .ready{display:grid;gap:14px;text-align:center;padding-top:6vh}
.mbq-guest .ready h1{font-size:72px;line-height:.92}
.mbq-guest .ready .hold{font:800 56px/1 var(--f-num)}
@media (prefers-reduced-motion:no-preference){
  .mbq-guest .g-live:not(.off) i{animation:mbq-pulse 2s ease-in-out infinite}
  .mbq-guest .ready h1{animation:mbq-pop .5s cubic-bezier(.2,.9,.3,1.2) both}
  .mbq .sheet.in{animation:mbq-up .22s ease-out both}
  .mbq .toast{animation:mbq-up .2s ease-out both}
}
@keyframes mbq-pulse{50%{opacity:.35}}
@keyframes mbq-pop{from{transform:scale(.9);opacity:0}}
@keyframes mbq-up{from{transform:translateY(16px);opacity:0}}

/* ---------- host ---------- */
.mbq-host .h-wrap{height:100%;display:flex;flex-direction:column}
.mbq-host{container-type:inline-size}
.mbq-host .h-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--surface)}
.mbq-host .h-head .brand{font-size:22px;white-space:nowrap}
.mbq-host .h-count{font-weight:600;color:var(--ink-2);white-space:nowrap}
.mbq-host .h-set{min-height:44px;min-width:44px;padding:8px 10px;font-size:14px;margin-left:auto;order:2}
.mbq-host .h-set span{display:none}
.mbq-host .h-queue{display:grid;gap:12px;align-content:start}
.mbq-host .h-quotes{display:flex;gap:6px;flex-wrap:wrap;align-items:center;order:3;flex-basis:100%;font-size:13px;color:var(--ink-3)}
.mbq-host .chip{display:inline-flex;align-items:baseline;gap:5px;padding:5px 10px;border-radius:999px;background:var(--rule-soft);color:var(--ink-2);font-size:13px;white-space:nowrap}
.mbq-host .chip b{color:var(--ink);font-weight:600}
.mbq-host .h-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 20px;display:grid;gap:18px;align-content:start}
.mbq-host .h-foot{padding:10px 16px 14px;border-top:1px solid var(--rule);background:var(--surface)}
.mbq-host h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.mbq-host h2 span{letter-spacing:0;text-transform:none}
.mbq-host .note{padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.mbq-host .next{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--ok-bg);border:1px solid var(--ok)}
.mbq-host .next .txt{flex:1;min-width:0}
.mbq-host .next .txt b{display:block;font-size:17px}
.mbq-host .next .txt span{font-size:14px;color:var(--ink-2)}
.mbq-host .q-list{display:grid;gap:8px}
.mbq-host .q-item{display:flex;align-items:stretch;gap:10px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:8px 8px 8px 0}
.mbq-host .q-item.is-called{border-color:var(--gold);box-shadow:inset 4px 0 0 var(--gold)}
.mbq-host .q-main{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;padding:4px 4px 4px 14px;border:0;background:none;text-align:left;border-radius:12px}
.mbq-host .q-size{grid-row:span 2;width:44px;height:44px;border-radius:12px;background:var(--rule-soft);display:grid;place-items:center;font:800 28px/1 var(--f-num)}
.mbq-host .q-name{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbq-host .q-meta{font-size:13px;color:var(--ink-3);line-height:1.3}
.mbq-host .q-meta .late{color:var(--warn);font-weight:600}
.mbq-host .q-item .btn{min-width:92px;flex-direction:column;gap:2px;padding:8px 12px}
.mbq-host .empty{padding:26px 16px;text-align:center;color:var(--ink-3);border:1px dashed var(--rule);border-radius:14px}
.mbq-host .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:2px}
.mbq-host .t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.mbq-host .t-chip{display:grid;gap:2px;padding:8px 10px 10px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);text-align:left;min-height:68px;position:relative;overflow:hidden}
.mbq-host .t-chip b{font:800 24px/1 var(--f-num);white-space:nowrap}
.mbq-host .t-chip b span{font:500 12px/1 var(--f-text);color:var(--ink-3);margin-left:5px}
.mbq-host .t-chip em{font-style:normal;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbq-host .t-chip i{position:absolute;left:0;bottom:0;height:4px;background:var(--ink-3);opacity:.5}
.mbq-host .t-chip.is-free,.mbq-host .t-chip.is-paid{background:var(--ok-bg);border-color:var(--ok)}
.mbq-host .t-chip.is-free em,.mbq-host .t-chip.is-paid em{color:var(--ok);font-weight:600}
.mbq-host .t-chip.is-held{background:var(--gold);border-color:var(--gold);color:#3B2F07}
.mbq-host .t-chip.is-held em,.mbq-host .t-chip.is-held b span{color:#3B2F07}
.mbq-host .t-chip.is-due i{background:var(--warn);opacity:1}
.mbq-host .t-chip.is-due em{color:var(--warn);font-weight:600}
@container (min-width:700px){
  .mbq-host .h-body{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);column-gap:22px}
  .mbq-host .h-foot .btn.big{max-width:420px}
}
@container (min-width:920px){
  .mbq-host .h-quotes{order:1;flex-basis:auto;margin-left:auto}
  .mbq-host .h-set{margin-left:0;padding:8px 12px}
  .mbq-host .h-set span{display:inline}
}

/* sheets and toast */
.mbq .layer{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;background:var(--shade)}
.mbq .sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 18px 22px;display:grid;gap:16px}
.mbq .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mbq .sheet-head h3{margin:0;font:800 30px/1 var(--f-num);letter-spacing:.01em}
.mbq .sheet-head .btn{min-height:40px;padding:6px 12px;font-size:14px}
.mbq .sheet .rows{display:grid;gap:8px}
.mbq .sheet .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);min-height:52px}
.mbq .sheet .row .grow{flex:1;min-width:0}
.mbq .sheet .row small{display:block;color:var(--ink-3);font-size:13px}
.mbq .sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbq .sheet .acts .btn.wide{grid-column:1/-1}
.mbq .step{display:inline-flex;align-items:center;gap:6px}
.mbq .step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);font-size:22px;line-height:1}
.mbq .step output{min-width:34px;text-align:center;font:800 26px/1 var(--f-num)}
.mbq .switch{width:56px;height:34px;border-radius:999px;border:1px solid var(--rule);background:var(--rule-soft);position:relative;flex:none}
.mbq .switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--rule);transition:transform .15s}
.mbq .switch[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.mbq .switch[aria-checked="true"]::after{transform:translateX(22px)}
.mbq .qr{display:grid;gap:10px;justify-items:center;padding:14px;border:1px solid var(--rule);border-radius:12px;background:#fff;color:#17233B}
.mbq .qr svg{width:180px;height:180px}
.mbq .qr code{font-size:12px;word-break:break-all;text-align:center}
.mbq .stats{font-size:14px;color:var(--ink-2)}
.mbq .toast{position:absolute;left:12px;right:12px;bottom:86px;z-index:6;margin:0 auto;max-width:520px;display:flex;align-items:center;gap:12px;
  padding:12px 12px 12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:15px}
.mbq .toast.bad{background:var(--bad);color:#fff}
.mbq .toast span{flex:1;min-width:0}
.mbq .toast button{min-height:40px;padding:6px 14px;border-radius:10px;border:1px solid currentColor;background:transparent;color:inherit;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="font:16px/1.5 system-ui,-apple-system,sans-serif;max-width:34em;margin:0 auto;padding:32px 20px">Please turn on JavaScript to join the queue, or speak to our host.</p></noscript>

<script>
var MBQ = window.MBQ || (window.MBQ = {});
(function (M) {

  };

    return new Promise(function (res, rej) {

  M.guests = function (n) { return n === 1 ? '1 guest' : n + ' guests'; };

  M.mins = function (ms) { return Math.max(0, Math.floor(ms / 60000)); };

(function (M) {
  var esc = M.esc;
  /* Guest page: join the queue in one screen, then watch a live ticket. */
  M.mountGuest = function (root, boot) {
    var KEY = boot.storeKey || 'mbq_tok';
    var S = { view: '', info: null, st: null, size: 2, busy: false, err: '', f: '', off: false, confirm: false, tok: boot.tok || M.store.get(KEY), skew: 0, html: '', n: 0 };

    root.querySelector('.brand').textContent = boot.name || 'Queue';
    var main = root.querySelector('.g-main'), live = root.querySelector('.g-live');
    function now() { return Date.now() + S.skew; }
    function $(sel) { return main.querySelector(sel); }

    }
    function online(ok) { S.off = !ok; paintLive(); }

      live.classList.toggle('off', S.off);
      live.lastChild.textContent = S.off ? 'Reconnecting…' : 'Live';
    }

    function apply(st) {

      S.st = st;
      if (st.st === 'none') { setTok(''); S.view = ''; return loadInfo(); }

    /* ---------- views ---------- */
    function joinHtml() {
      return '<div><h1>Join the queue</h1><p class="lead" data-q></p></div>' +
        '<form novalidate>' +
        '<div class="field" data-f="s"><span class="label" id="g-size-l">How many of you?</span><div class="sizes" role="radiogroup" aria-labelledby="g-size-l"></div><span class="err" hidden></span></div>' +
        '<div class="field" data-f="n"><label for="g-name">Your first name</label><input id="g-name" autocomplete="given-name" autocapitalize="words" maxlength="24" enterkeyhint="next"><span class="err" hidden></span></div>' +
        '<div class="field" data-f="ph"><label for="g-phone">Mobile number</label><input id="g-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" enterkeyhint="done"><span class="hint"></span><span class="err" hidden></span></div>' +
        '<span class="err" data-err hidden></span>' +
        '<button class="btn primary big" type="submit">Join the queue</button>' +
        '<p class="fine">We use your details only for today’s queue and delete them overnight.</p>' +
        '</form>';
    }
    function patchJoin() {
      var info = S.info, box = $('.sizes');

        var h = '';

          : 'Right now there’s <b>almost no wait</b> for a table for ' + who + '.';

      add: function () { S.addSize = 2; open({ type: 'add' }); },
      close: close,
      size: function (b) {
        S.addSize = Number(b.getAttribute('data-size'));

      'add-go': function () {
        var n = el.layer.querySelector('#a-name').value, ph = el.layer.querySelector('#a-phone').value;
        if (S.busy) return;
        S.busy = true;
        send('h.add', { n: n, s: S.addSize, ph: ph }).then(function (r) {
          S.busy = false; close(); apply(r);
          var q = r.added.q;
          toast('Added ' + r.added.n + '.' + (q ? ' Tell them ' + (q.lo ? M.rangeText(q) : 'there’s almost no wait') + '.' : '') + (r.note === 'sms_failed' ? ' The text didn’t send.' : ''), r.undo);

      call: function (b) {
        var id = b.getAttribute('data-id'), p = party(id);
        if (!p) return;
        var tb = b.getAttribute('data-tb') || pairs()[id] || (p.st === 'called' ? p.tb : '') || '';

        act('h.call', { id: id, tb: tb }, function (r) {
          var where = tb ? ' to table ' + tb : '';
          if (r.note === 'sms') toast('Texted ' + p.n + where + '.', r.undo);
          else if (r.note === 'sms_failed') toast('The text to ' + p.n + ' didn’t send. Call out their name.', r.undo, true);
          else toast(p.n + ' is called' + where + '. Call out their name.', r.undo);
        });
      },
      seat: function (b) {
        var id = b.getAttribute('data-id'), p = party(id);
        if (!p) return;

        open({ type: 'seat', id: id });

      'seat-go': function (b) { var p = party(S.sheet.id); if (p) seat(p, b.getAttribute('data-tb')); },
      'seat-direct': function (b) { var p = party(b.getAttribute('data-id')); if (p) seat(p, b.getAttribute('data-tb')); },
      more: function (b) { open({ type: 'party', id: b.getAttribute('data-id') }); },
      noshow: function (b) { end('h.noshow', b.getAttribute('data-id'), ' marked as no-show.'); },
      remove: function (b) { end('h.remove', b.getAttribute('data-id'), ' removed.'); },
      'p-size': function (b) {
        var p = party(S.sheet.id), s = p ? p.s + Number(b.getAttribute('data-d')) : 0;
        if (p && s >= 1 && s <= S.st.cfg.maxHost) act('h.edit', { id: p.id, s: s });
      },
      table: function (b) { open({ type: 'table', tb: b.getAttribute('data-tb') }); },
      undo: function () {
        var u = S.toast && S.toast.undo;
        el.toast.hidden = true; S.toast = null;
        if (u) act('h.undo', { u: u });

      'sw-join': function () { act('h.cfg', { patch: { selfJoin: !S.st.cfg.selfJoin } }, function () { renderSheet(); }); },
      hold: function (b) {
        var v = S.st.cfg.holdMin + Number(b.getAttribute('data-d'));
        if (v >= 1 && v <= 30) act('h.cfg', { patch: { holdMin: v } }, function () { renderSheet(); });
      },
      'tb-seats': function (b) {
        var id = b.getAttribute('data-tb'), list = allTables();
        list.forEach(function (t) { if (t.id === id) t.seats = Math.max(0, Math.min(20, t.seats + Number(b.getAttribute('data-d')))); });
        saveTables(list);
      },
      'tb-add': function () {
        var v = el.layer.querySelector('#s-newtb').value.trim(), list = allTables();
        if (!/^\d{1,4}$/.test(v)) return toast('Type the table number, for example 59.', null, true);
        v = String(Number(v));
        if (!list.some(function (t) { return t.id === v; })) list.push({ id: v, seats: 2 });
        saveTables(list);
      },
      clear: function () {
        if (!S.arm) { S.arm = true; return renderSheet(); }
        close();
        act('h.clear', {}, function () { toast('Queue cleared.'); });
      },
      copy: function () {
        try { navigator.clipboard.writeText(S.links.guest).then(function () { toast('Link copied.'); }, function () { toast('Select the link and copy it.', null, true); }); }
        catch (e) { toast('Select the link and copy it.', null, true); }
      }
    };
    function seat(p, tb) {
      close();
      act('h.seat', { id: p.id, tb: tb || '' }, function (r) { toast(p.n + ' seated' + (tb ? ' at table ' + tb : '') + '.', r.undo); });
    }
    function end(a, id, text) {
      var p = party(id);
      if (!p) return;
      close();
      act(a, { id: id }, function (r) { toast(p.n + text, r.undo); });
    }
    root.addEventListener('click', function (ev) {
      if (ev.target === el.layer) return close();
      var b = ev.target.closest('[data-act]');
      if (!b || !root.contains(b)) return;
      var f = on[b.getAttribute('data-act')];
      if (f) f(b);

    root.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && S.sheet) close();
      if (ev.key === 'Enter' && S.sheet && S.sheet.type === 'add' && ev.target.tagName === 'INPUT') on['add-go']();
    });

    setInterval(function () { if (!document.hidden && !S.busy) refresh(); }, (boot.poll || 6) * 1000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
    refresh();
    return { refresh: refresh };

})(MBQ);

/* Start-up code of the page that lives outside Google (GitHub Pages or any plain hosting).
   The queue screens are the same as inside Apps Script. Here they get the google.script.run they expect,
   answered by plain requests to the web app. The requests carry no Google sign-in, so the page opens
   in any browser, whichever Google accounts are signed in there. */
(function (M) {

  var app = document.getElementById('app');

  function post(req) {
    return new Promise(function (res, rej) {
      var ctl = typeof AbortController === 'function' ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctl) ctl.abort(); rej(new Error('timeout')); }, 25000);

      withFailureHandler: function (f) { return runner(ok, f); },

    };

  function keep(state, params) {
    var t = params && params.t;
    try { window.history.replaceState(null, '', location.pathname + (t ? '#t=' + t : '')); } catch (e) { /* the ticket is also kept in the browser's storage */ }
  }

  function params(s) {
    var o = {};
    String(s || '').replace(/^[?#]/, '').split('&').forEach(function (kv) {
      var i = kv.indexOf('=');

  window.addEventListener('hashchange', function () { location.reload(); });

  if (h.host == null && q.v !== 'host') {

    return;
  }

  if (!key) return mount('');
  app.className = 'mbq mbq-host';
  app.innerHTML = '<div class="h-wrap"><div class="h-body"><div class="empty"><b>Loading…</b></div></div></div>';
